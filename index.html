<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark-hc">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozinha Acessível — Receitas sem Barreiras</title>
  <style>
    /* ==========================================================================
       1. VARIÁVEIS DE TEMA E TIPOGRAFIA (WCAG AAA - Contraste >= 7:1)
       ========================================================================== */
    :root {
      --font-scale: 1;
      --line-height: 1.6;
      --focus-ring: 4px solid #00ffff;
      
      /* Tema Padrão: Alto Contraste Escuro (Contraste > 18:1) */
      --bg-primary: #050a14;
      --bg-secondary: #0f1b33;
      --text-primary: #ffffff;
      --text-secondary: #e2e8f0;
      --accent: #66d9ff;
      --accent-text: #050a14;
      --border-color: #ffffff;
    }

    [data-theme="yellow-black"] {
      /* Tema Amarelo sobre Preto (Contraste 19.56:1) */
      --bg-primary: #000000;
      --bg-secondary: #141400;
      --text-primary: #ffff00;
      --text-secondary: #ffff66;
      --accent: #ffff00;
      --accent-text: #000000;
      --border-color: #ffff00;
      --focus-ring: 4px solid #ffffff;
    }

    [data-theme="light"] {
      /* Tema Claro Alto Contraste (Contraste > 15:1) */
      --bg-primary: #ffffff;
      --bg-secondary: #f1f5f9;
      --text-primary: #0a0a0a;
      --text-secondary: #1e293b;
      --accent: #003366;
      --accent-text: #ffffff;
      --border-color: #0a0a0a;
      --focus-ring: 4px solid #b30000;
    }

    /* ==========================================================================
       2. RESET E ESTILOS BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-size: calc(18px * var(--font-scale));
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: var(--line-height);
      overflow-x: hidden;
    }

    /* Anéis de Foco Rigorosos (WCAG AAA) */
    :focus-visible {
      outline: var(--focus-ring);
      outline-offset: 4px;
    }

    /* Skip Link */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      background: var(--accent);
      color: var(--accent-text);
      padding: 16px 24px;
      font-weight: 700;
      text-decoration: none;
      border: 3px solid var(--border-color);
      z-index: 1000;
      border-radius: 4px;
    }

    .skip-link:focus {
      top: 16px;
    }

    /* Classe utilitária apenas para leitores de tela */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ==========================================================================
       3. LAYOUT DE COLUNA ÚNICA E COMPONENTES GRANDES (>= 48x48px)
       ========================================================================== */
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    header {
      background-color: var(--bg-secondary);
      border-bottom: 3px solid var(--border-color);
      padding: 1rem 0;
    }

    .a11y-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border-color);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    button, .btn {
      min-height: 52px;
      min-width: 52px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      border: 3px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-align: center;
    }

    button:hover, button[aria-pressed="true"] {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    h1 {
      font-size: 2rem;
      margin: 0.5rem 0 1rem 0;
      line-height: 1.25;
    }

    h2 {
      font-size: 1.5rem;
      margin: 2rem 0 1rem 0;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    h3 {
      font-size: 1.25rem;
      margin: 1.25rem 0 0.75rem 0;
    }

    /* Busca e Inputs */
    .search-box {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin: 1.5rem 0;
      background-color: var(--bg-secondary);
      padding: 1.25rem;
      border: 3px solid var(--border-color);
      border-radius: 8px;
    }

    .search-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    input[type="search"], select {
      min-height: 54px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border: 3px solid var(--border-color);
      border-radius: 6px;
      flex: 1;
    }

    /* Categorias */
    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }

    /* Cards de Receita (Coluna Única) */
    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      list-style: none;
      padding: 0;
    }

    .recipe-card {
      background-color: var(--bg-secondary);
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-weight: 700;
      margin: 0.75rem 0;
    }

    /* ==========================================================================
       4. PÁGINA DA RECEITA E MODO COZINHA
       ========================================================================== */
    .audio-panel {
      background-color: var(--bg-secondary);
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      margin: 1.5rem 0;
    }

    .audio-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    /* Checkboxes Gigantes de Ingredientes */
    .ingredient-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .ingredient-item label {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      min-height: 56px;
      background-color: var(--bg-secondary);
      border: 3px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .ingredient-item input[type="checkbox"] {
      width: 32px;
      height: 32px;
      min-width: 32px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .ingredient-item input[type="checkbox"]:checked + span {
      text-decoration: line-through;
      opacity: 0.8;
    }

    /* Modo Passo a Passo Guiado (Tela Cheia) */
    .guided-overlay {
      position: fixed;
      inset: 0;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      z-index: 900;
      overflow-y: auto;
      padding: 1.5rem;
      display: none;
    }

    .guided-overlay.active {
      display: block;
    }

    .guided-container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .step-card {
      background-color: var(--bg-secondary);
      border: 4px solid var(--border-color);
      border-radius: 10px;
      padding: 2rem 1.5rem;
      font-size: 1.25rem;
    }

    .sensory-badge {
      display: inline-block;
      background-color: var(--accent);
      color: var(--accent-text);
      padding: 0.4rem 0.8rem;
      font-weight: 700;
      border-radius: 4px;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .guided-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .guided-nav button {
      min-height: 68px;
      font-size: 1.15rem;
    }

    .timer-box {
      background-color: var(--bg-secondary);
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .timer-display {
      font-size: 1.75rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    footer {
      margin-top: 4rem;
      padding: 2rem 0;
      border-top: 3px solid var(--border-color);
      background-color: var(--bg-secondary);
    }

    @media (max-width: 600px) {
      .guided-nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Skip Link (Visível ao focar via teclado) -->
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <!-- Região Live para Feedback Imediato a Leitores de Tela -->
  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <header>
    <div class="container">
      <nav aria-label="Configurações de Acessibilidade Visual">
        <div class="a11y-toolbar">
          <div class="toolbar-group" role="group" aria-label="Tema de Alto Contraste">
            <button type="button" id="theme-dark" aria-pressed="true" onclick="setTheme('dark-hc', this)">
              Modo Alto Contraste Escuro
            </button>
